<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Elisa OS</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Elisa" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png" />

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="android-ios-skin">

    <!-- STATUS BAR -->
    <header class="status-bar">
      <span id="app-title">Elisa OS</span>
    </header>

    <!-- VIEW PRINCIPAL -->
    <main id="view" class="main-view">
      <!-- Conteúdo renderizado pelo JS -->
    </main>

    <!-- TAB BAR -->
    <nav class="tab-bar">
      <button data-view="home">Home</button>
      <button data-view="apps">Apps</button>
      <button data-view="ia">IA</button>
      <button data-view="settings">Ajustes</button>
    </nav>

  </div>

  <!-- Scripts -->
  <script src="main.js"></script>
  <script src="app.js"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registrado'))
        .catch(err => console.error('Erro ao registrar SW:', err));
    }
  </script>
</body>
</html>
